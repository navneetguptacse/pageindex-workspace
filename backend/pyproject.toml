[project]
name = "page-index"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
    "anyio",
    "fastapi[standard]>=0.165.0",
    "sqlmodel>=0.0.50",
    "litellm",
    "pageindex>=0.7.4",
    "pypdfium2",
    "pillow",
    "pydantic-settings>=2.0",
    "python-multipart",
    "psycopg[binary]>=3.2,<4",
    "redis>=6,<9",
]

[tool.fastapi]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "ruff==0.17.5",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
