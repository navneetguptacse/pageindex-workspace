x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *defaults
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pageindex}
      POSTGRES_USER: ${POSTGRES_USER:-pageindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    <<: *defaults
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_MAXMEMORY:-64mb}", "--maxmemory-policy", "allkeys-lru", "--active-expire-effort", "1"]
    mem_limit: ${REDIS_MEMORY_LIMIT:-160m}
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *defaults
    build:
      context: .
      target: backend
    env_file: ./.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-pageindex}
      POSTGRES_USER: ${POSTGRES_USER:-pageindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      UPLOAD_DIR: /var/lib/pageindex/uploads
      REDIS_URL: redis://redis:6379/0
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - uploads:/var/lib/pageindex/uploads
    networks: [app, data]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    <<: *defaults
    build:
      context: .
      target: frontend
    ports:
      - "127.0.0.1:${HTTP_PORT:-3000}:3000"
    networks: [app]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  app:
  data:
    internal: true

volumes:
  postgres_data:
  uploads:
